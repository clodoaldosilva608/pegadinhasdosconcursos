<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#07152F" />
<title>Você está offline · Pegadinhas dos Concursos</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(120% 90% at 50% 0%, #0A1840 0%, #07152F 45%, #050D20 100%);
    color: #E6EDF7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px; text-align: center;
  }
  .card { max-width: 420px; }
  .brand {
    font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
    background: linear-gradient(180deg, #F5F7FB 0%, #C9D4E8 55%, #F5B301 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    font-size: 20px; margin-bottom: 6px;
  }
  .divider { width: 64px; height: 3px; margin: 14px auto 18px; border-radius: 2px;
    background: linear-gradient(90deg, #1E63D0, #F5B301); }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p { color: #9FB0CC; line-height: 1.6; margin: 0 0 22px; }
  button {
    appearance: none; border: 0; cursor: pointer; border-radius: 12px; padding: 12px 28px;
    font-size: 15px; font-weight: 700; color: #07152F;
    background: linear-gradient(180deg, #FFD54A, #F5B301);
    box-shadow: 0 6px 18px rgba(245, 179, 1, 0.25);
  }
  button:active { transform: translateY(1px); }
  .hint { margin-top: 18px; font-size: 12.5px; color: #6D7FA0; }
</style>
</head>
<body>
  <main class="card">
    <div class="brand">Pegadinhas dos Concursos</div>
    <div class="divider"></div>
    <h1>Você está offline</h1>
    <p>Sem conexão com a internet agora. O Detector de Pegadinhas precisa de rede para analisar a questão — reconecte e tente de novo.</p>
    <button onclick="location.reload()">Tentar novamente</button>
    <p class="hint">Suas análises e seus dados ficam seguros no servidor — nada é perdido.</p>
  </main>
</body>
</html>
