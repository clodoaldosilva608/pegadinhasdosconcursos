<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="DestravaStudy — águia dourada">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="0.45" stop-color="#f2c14e"/>
      <stop offset="1" stop-color="#b98a24"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#144434"/>
      <stop offset="1" stop-color="#0a241c"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="228" height="228" rx="52" fill="url(#bg)"/>
  <rect x="6" y="6" width="228" height="228" rx="52" fill="none" stroke="url(#gold)" stroke-width="5" opacity="0.95"/>
  <circle cx="120" cy="122" r="86" fill="none" stroke="#f2c14e" stroke-width="2" opacity="0.3"/>
  <!-- estrela do topo -->
  <path d="M120 30 l5.6 11.4 12.6 1.8 -9.1 8.9 2.1 12.5 -11.2 -5.9 -11.2 5.9 2.1 -12.5 -9.1 -8.9 12.6 -1.8 Z" fill="url(#gold)"/>
  <!-- asa esquerda -->
  <g stroke="url(#gold)" stroke-linecap="round" fill="none">
    <path d="M112 118 C84 112 62 96 52 70" stroke-width="11"/>
    <path d="M110 132 C88 128 70 116 60 98" stroke-width="10"/>
    <path d="M108 146 C92 142 78 134 69 122" stroke-width="9"/>
  </g>
  <!-- asa direita -->
  <g stroke="url(#gold)" stroke-linecap="round" fill="none">
    <path d="M128 118 C156 112 178 96 188 70" stroke-width="11"/>
    <path d="M130 132 C152 128 170 116 180 98" stroke-width="10"/>
    <path d="M132 146 C148 142 162 134 171 122" stroke-width="9"/>
  </g>
  <!-- corpo -->
  <path d="M120 96 C129 108 133 124 131 142 C129 158 125 171 120 182 C115 171 111 158 109 142 C107 124 111 108 120 96 Z" fill="url(#gold)"/>
  <!-- cabeça + bico -->
  <circle cx="120" cy="92" r="10.5" fill="url(#gold)"/>
  <path d="M129 87 l14 5 -14 5 Z" fill="url(#gold)"/>
  <!-- cauda -->
  <path d="M120 180 l-9 18 9 -7 9 7 Z" fill="url(#gold)"/>
  <!-- base: três linhas (estudo → evolução → conquista) -->
  <g stroke="url(#gold)" stroke-linecap="round">
    <path d="M92 202 h56" stroke-width="5"/>
    <path d="M102 212 h36" stroke-width="4" opacity="0.75"/>
    <path d="M110 221 h20" stroke-width="3" opacity="0.5"/>
  </g>
</svg>
